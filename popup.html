<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 290px; margin: 12px; font: 14px system-ui, sans-serif; background: #fff; color: #0f1419; }
    label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    p { margin: 10px 0 0; font-size: 12px; color: #536471; }
    label.next { margin-top: 16px; }
    h1 { margin: 0 0 12px; font-size: 15px; }
    h1 span { font-weight: normal; color: #536471; }
    @media (prefers-color-scheme: dark) {
      body { background: #15202b; color: #e7e9ea; }
      p, h1 span { color: #8b98a5; }
    }
  </style>
</head>
<body>
  <h1><b id="name"></b> <span id="version"></span></h1>
  <label>
    <input type="checkbox" id="autoExpand">
    <span data-i18n="popupAuto"></span>
  </label>
  <p data-i18n="popupAutoHint"></p>
  <label class="next">
    <input type="checkbox" id="wide">
    <span data-i18n="popupWide"></span>
  </label>
  <p data-i18n="popupWideHint"></p>
  <label class="next">
    <input type="checkbox" id="showSpam">
    <span data-i18n="popupSpam"></span>
  </label>
  <p data-i18n="popupSpamHint"></p>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
